[project]
name = "jarvis-desktop-assistant"
version = "0.2.0"
description = "Jarvis Windows desktop assistant"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "qasync>=0.27",
  "openwakeword>=0.6.0",
  "faster-whisper>=1.0.0",
  "sounddevice>=0.4.7",
  "numpy>=1.26",
  "pydantic>=2.7",
  "piper-tts>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Tests"]
asyncio_mode = "auto"
